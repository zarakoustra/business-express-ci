<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A8DDF7">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap">
<title>ZARAKOUSTRA</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MZ78EHSL6R"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-MZ78EHSL6R');
</script>
<style>
:root{
  --bg:#F4FAFF;--tx:#0B2545;--mu:#3E5C76;
  --bd:#CFE8F7;--cd:#FFFFFF;--nv:#A8DDF7;
  --hd:#0B2545;--ac:#0B6FA8;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;
}
header{
  background:var(--nv);color:var(--hd);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
h1{margin:0;font-size:19px}
main{
  max-width:560px;margin:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
}
h2{margin:4px 0}
input,textarea,select{
  width:100%;min-height:44px;padding:8px 12px;
  font-size:16px;border:1px solid var(--bd);border-radius:10px;
  background:var(--cd);color:var(--tx);
}
button{
  min-height:48px;font-size:16px;font-weight:700;border-radius:12px;
  padding:0 16px;border:0;cursor:pointer;
}
header button{min-height:40px;background:#fff;color:#0B2545}
header #top{
  flex:0 0 auto;padding:0 10px;font-size:14px;min-height:40px;
  background:transparent;color:#000;border:2px solid #000;
}
.btn{background:#5BB8EA;color:#0B2545}
.btn2{background:var(--cd);color:var(--ac);border:1px solid var(--ac)}
.lnk{
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  min-height:48px;border-radius:12px;font-weight:700;
}
section{
  background:var(--cd);border:1px solid var(--bd);border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:8px;
}
.row{display:flex;gap:8px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.card{
  min-height:0;padding:8px;font-weight:400;text-align:left;
  background:var(--cd);border:1px solid var(--bd);
  display:flex;flex-direction:column;gap:4px;color:var(--tx);font-size:15px;
}
button.card b{font-size:16px}
.mu{color:var(--mu);margin:0;font-size:14px}
.ok{color:var(--ac);font-weight:700;font-size:13px;margin:0}
.strip{display:flex;gap:8px;overflow-x:auto}
.strip img{height:200px;width:auto;border-radius:8px;flex:none}
.safe{
  border:1px solid var(--ac);border-radius:10px;padding:10px;font-size:14px;margin:0;
}
.mod{
  display:flex;flex-direction:column;gap:6px;border:1px solid var(--bd);
  border-radius:10px;padding:8px;font-size:14px;
}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:auto;min-height:0}
#terms p{margin:0;font-size:14px}
[hidden]{display:none!important}

/* Photo de profil */
.pf{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.pft{font-size:11px;font-weight:700;order:2;margin-top:2px}
.pfa{position:relative;width:44px;height:44px}
.pfa img{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:3px solid #000;
}
.pfc{
  position:absolute;right:-6px;bottom:-4px;font-size:12px;font-style:normal;
  background:#fff;border-radius:50%;padding:2px;border:1.5px solid #000;
}

/* Titre ZARAKOUSTRA */
header h1{
  width:max-content;
  flex:0 0 auto;
  margin:0 auto;
  padding:6px 0.5cm;
  text-indent:0;
  text-align:center;
  border:3px solid #000;
  border-radius:14px;
  background:#fff;
  box-shadow:4px 4px 0 #000;
  animation:zkneon 2s infinite;
  font-family:'Montserrat','Arial Black',Arial,sans-serif;
  font-weight:900;
  font-size:clamp(18px,5vw,26px);
  letter-spacing:.03em;
  line-height:1.2;
  text-transform:uppercase;
  white-space:nowrap;
  min-width:0;
  color:#0B2545;
  text-shadow:
    -2px -2px 0 #000,2px -2px 0 #000,
    -2px 2px 0 #000,2px 2px 0 #000,
    0 3px 0 #000;
}
@keyframes zkneon{
0%,100%{box-shadow:0 0 8px #00E5FF,inset 0 0 8px rgba(0,229,255,.45)}
50%{box-shadow:0 0 16px #00E5FF,inset 0 0 12px rgba(0,229,255,.7)}
}
@media (prefers-reduced-motion:reduce){header h1{animation:none}}

/* Thème sombre et paramètres */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101820;
  --tx:#F1F5F9;
  --mu:#AAB8C5;
  --bd:#34495A;
  --cd:#1B2935;
  --nv:#243C50;
  --hd:#FFFFFF;
  --ac:#65BDEB;
}
#settingsPanel{
  display:none;
  flex-direction:column;
  gap:12px;
}
body[data-tab="acc"].settings-open #settingsPanel{
  display:flex;
}
body[data-tab="acc"].settings-open #xacc > :not(#settingsPanel){
  display:none !important;
}
#settingsPanel label{
  display:block;
  font-weight:600;
}

#xagadm:empty{display:none!important}
</style>
</head>
